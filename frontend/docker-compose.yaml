version: "3.8"
services:
  feedback-frontend:
      image: feedback-frontend:latest
      build:
        context: .
        dockerfile: Dockerfile
      container_name: feedback-frontend
      restart: unless-stopped
      ports:
         - "4176:8080"
      environment:
         TZ: Asia/Kolkata
      volumes:
          - /etc/localtime:/etc/localtime/:ro
      healthcheck:
         test:
            [
             "CMD-SHELL",
             "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080 || exit 1"
            ]
         interval: 30s
         timeout: 5s
         retries: 3
         start_period: 15s

      logging:
          driver: json-file
          options:
            max-size: "5m"
            max-file: "5"
      security_opt:
            - no-new-privileges:true
#      cap_drop:
 #          - ALL
#      tmpfs:
 #      - /var/cache/nginx
